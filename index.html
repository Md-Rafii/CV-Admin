<!doctype html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>রেটবন্ধু অ্যাডমিন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#fff;--soft:#f2f6ff;--ink:#0f1b3d;--mute:#5b6786;--pri:#1d4ed8;--line:#dbe4f7;--err:#b42318;--ok:#067647}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--soft:#121c33;--ink:#e8eefc;--mute:#9fb0d3;--pri:#6b94ff;--line:#22304f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:20px;color:var(--pri)}main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:11px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{min-height:1.4em;margin-top:8px}.err{color:var(--err)}.ok{color:var(--ok)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pri);color:#fff;font-size:13px}
.big{font-size:28px;font-weight:700;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
[hidden]{display:none!important}
</style><style>header{background:var(--ink)}header b{color:#fff}</style></head><body>
<header><b>রেটবন্ধু অ্যাডমিন</b><button id="out" class="ghost" hidden>লগআউট</button></header>
<main>
<section id="login" class="card"><h2>অ্যাডমিন লগইন</h2>
 <label for="em">ইমেইল</label><input id="em" type="email"><label for="pw">পাসওয়ার্ড</label><input id="pw" type="password">
 <div class="row"><button id="go">লগইন</button></div><div id="m" class="msg" role="status"></div></section>
<section id="panel" hidden><div class="grid">
 <div class="card"><div>মোট ইউজার</div><div class="big" id="u">—</div></div>
 <div class="card"><div>পেন্ডিং পেমেন্ট</div><div class="big" id="p">—</div></div></div>
 <div class="card">পেমেন্ট অনুমোদন, প্ল্যান ও সেটিংস পরের ধাপে যোগ হবে।</div></section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {collection,query,where,getCountFromServer} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// TODO: Firebase Console → Project settings → Your apps থেকে সঠিক appId বসান।
const firebaseConfig = {
  apiKey: "AIzaSyAxmmXGlmCHrSEvNstpgLxguCy8Xq3xMvE",
  authDomain: "e-wallet-95fb2.firebaseapp.com",
  databaseURL: "https://e-wallet-95fb2-default-rtdb.firebaseio.com",
  projectId: "e-wallet-95fb2",
  storageBucket: "e-wallet-95fb2.firebasestorage.app",
  messagingSenderId: "274036792120",
  appId: "1:881fbe414e648ee43fcd", // ⚠ অসম্পূর্ণ — মূল প্রজেক্ট থেকে নিন
  measurementId: "G-7ZK36WX89V"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $=i=>document.getElementById(i),say=t=>{$("m").textContent=t;$("m").className="msg err"};
$("go").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch{say("লগইন ব্যর্থ হয়েছে।")}};
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$("out").hidden=!u;$("login").hidden=!!u;$("panel").hidden=true;if(!u)return;
 const t=await u.getIdTokenResult(true);   // admin ক্লেইম সার্ভার-সাইন করা টোকেনে
 if(t.claims.admin!==true){await signOut(auth);return say("এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।")}
 $("login").hidden=true;$("panel").hidden=false;
 try{$("u").textContent=(await getCountFromServer(collection(db,"users"))).data().count;
  $("p").textContent=(await getCountFromServer(query(collection(db,"paymentRequests"),where("status","==","pending")))).data().count}catch{}});
</script></body></html>
